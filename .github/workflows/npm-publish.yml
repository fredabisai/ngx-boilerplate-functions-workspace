name: Publish npm package and GitHub release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-master
  cancel-in-progress: false

env:
  LIBRARY_PACKAGE_JSON: projects/ngx-boilerplate-functions/package.json
  DIST_DIRECTORY: dist/ngx-boilerplate-functions

jobs:
  release:
    name: Test, build, and release
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: |
          node --input-type=commonjs <<'NODE'
          const {execFileSync} = require('node:child_process');
          const npmVersion = execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim();
          const [major, minor, patch] = npmVersion.split('.').map(Number);
          if (
            major < 11 ||
            (major === 11 && minor < 5) ||
            (major === 11 && minor === 5 && patch < 1)
          ) {
            throw new Error(`npm 11.5.1 or newer is required; found ${npmVersion}.`);
          }
          NODE

      - name: Read and validate release metadata
        id: metadata
        run: |
          PACKAGE_NAME=$(node -p "require('./${LIBRARY_PACKAGE_JSON}').name")
          VERSION=$(node -p "require('./${LIBRARY_PACKAGE_JSON}').version")

          if [ "$PACKAGE_NAME" != "@ngx-boilerplate-functions/forms" ]; then
            echo "Unexpected package name: $PACKAGE_NAME" >&2
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Package version is not valid semantic versioning: $VERSION" >&2
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag and npm publication state
        id: release_state
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG_NAME: ${{ steps.metadata.outputs.tag }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME" 2>/dev/null || true)
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "$TAG_NAME already points to $TAG_COMMIT; bump the package version." >&2
            exit 1
          fi

          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED=true
          else
            PUBLISHED=false
          fi

          if [ "$PUBLISHED" = true ] && [ -z "$TAG_COMMIT" ]; then
            echo "$PACKAGE_NAME@$VERSION is already on npm without a matching tag." >&2
            echo "Bump the package version or recover the release manually." >&2
            exit 1
          fi

          echo "tag_exists=$([ -n "$TAG_COMMIT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type-check library and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Verify publishable package contents
        run: npm run pack:check

      - name: Verify generated package metadata
        env:
          EXPECTED_NAME: ${{ steps.metadata.outputs.package_name }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          node --input-type=commonjs <<'NODE'
          const source = require(`./${process.env.LIBRARY_PACKAGE_JSON}`);
          const built = require(`./${process.env.DIST_DIRECTORY}/package.json`);
          if (built.name !== process.env.EXPECTED_NAME || built.name !== source.name) {
            throw new Error(`Built package name mismatch: ${built.name}`);
          }
          if (built.version !== process.env.EXPECTED_VERSION || built.version !== source.version) {
            throw new Error(`Built package version mismatch: ${built.version}`);
          }
          NODE

      - name: Create and push release tag
        if: steps.release_state.outputs.tag_exists != 'true'
        env:
          TAG_NAME: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG_NAME" --message "Release $VERSION" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

      - name: Publish package to npm
        if: steps.release_state.outputs.published != 'true'
        working-directory: ${{ env.DIST_DIRECTORY }}
        run: npm publish --access public
        env:
          # Trusted Publishing uses OIDC first. If configured, NPM_TOKEN is a
          # fallback repository/environment secret for traditional npm auth.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists; nothing to create."
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "v$VERSION" \
              --generate-notes
          fi
